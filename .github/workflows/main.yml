name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ล็อคเวอร์ชัน Gradle เป็น 8.11.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    # สร้างไฟล์จำลอง .env.example
    - name: Create missing .env.example file
      run: touch .env.example

    # สร้างไฟล์จำลอง google-services.json ที่มี package_name ตรงกับ com.aistudio.cartracker.v89q
    - name: Create Mock google-services.json
      run: |
        mkdir -p app
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "cartrack-app",
            "storage_bucket": "cartrack-app.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": {
                  "package_name": "com.aistudio.cartracker.v89q"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyDummyKeyForBuild123456789"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
